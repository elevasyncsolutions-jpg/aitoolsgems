<body class="p-6">

var s1=document.getElementById("t1"),s2=document.getElementById("t2");
tools.forEach(function(t,i){
  s1.innerHTML+='<option value="'+i+'">'+t.name+' ('+t.cat+')</option>';
  s2.innerHTML+='<option value="'+(i==1?0:i==0?1:i)+'">'+tools[i==1?0:i==0?1:i].name+' ('+tools[i==1?0:i==0?1:i].cat+')</option>';

function compare(){
  var a=tools[s1.value],b=tools[s2.value];
  var features=[
    {l:"Price",a:a.price,b:b.price},
    {l:"Free Tier",a:a.free?"Yes":"No",b:b.free?"Yes":"No"},
    {l:"Rating",a:bar(a.rating,10),b:bar(b.rating,10),raw:true},
    {l:"Speed",a:bar(a.speed,10),b:bar(b.speed,10),raw:true},
    {l:"Context",a:a.context,b:b.context},
    {l:"Multimodal",a:a.multimodal?"Yes":"No",b:b.multimodal?"Yes":"No"},
    {l:"API Access",a:a.api?"Yes":"No",b:b.api?"Yes":"No"},
    {l:"Best For",a:a.cat,b:b.cat}
  ];
  var aw=a.rating>=b.rating,bw=b.rating>=a.rating;
  var h='<div class="row"><div class="side'+(aw?' winner':'')+'"><h3>'+a.name+'</h3><p class="text-gray-400 text-sm mb-4">'+a.desc+'</p>';

  h+='<div class="text-center"><a href="https://aitoolsgems.netlify.app/" class="text-[#00ff66] font-semibold">See all '+a.cat.toLowerCase()+' tools →</a></div>';
  document.getElementById("out").innerHTML=h;
}
compare();
